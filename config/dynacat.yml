server:
  assets-path: /app/assets

branding:
  # custom-footer: |
  #   <p>Powered by <a href="https://github.com/Panonim/dynacat">Dynacat</a></p>
  logo-url: /assets/images/app-icon.png
  favicon-url: /assets/images/app-icon.png
  app-name: 'RedVelocity Dashboard'
  app-icon-url: '/assets/images/app-icon.png'
  hide-footer: true
  # app-background-color: '#151519'

theme:
  background-color: 203 27 9
  contrast-multiplier: 1.2
  primary-color: 165 78 51
  positive-color: 165 78 51
  negative-color: 360 100 71
  disable-picker: true
  custom-css-file: /assets/global.css

pages:
  - name: Home
    # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
    # hide-desktop-navigation: true
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: sunday

          - type: clock
            hour-format: 24h
            timezones:
              - timezone: Asia/Kolkata
                label: Bengaluru

          - type: html
            update-interval: 15m
            source: |
              <iframe
                src="https://api.wo-cloud.com/content/widget/?geoObjectKey=15339767&language=en&region=GB&timeFormat=HH:mm&windUnit=kmh&systemOfMeasurement=metric&temperatureUnit=celsius"
                name="CW2"
                title="Weather widget"
                frameborder="0"
                width="100%"
                height="318"
                style="border-radius:8px; margin-top:2rem;" ></iframe>

      - size: full
        widgets:
          - type: split-column
            frameless: true
            widgets:
              - $include: prowlarr.yml
                css-class: widget-type-prowlarr-custom
              - type: dns-stats
                update-interval: 5m
                service: adguard
                url: https://ag.${BASE_HOST}/
                hide-top-domains: true
                username: ${AG_USER}
                password: ${AG_PASSWORD}

          - type: monitor
            update-interval: 1m
            hide-header: true
            title: Services
            sites:
              - title: Jellyfin
                url: https://jelly.${BASE_HOST}/
                icon: sh:jellyfin
              - title: Seerr
                url: https://seerr.${BASE_HOST}/
                icon: sh:seerr
              - title: qBittorrent # only for Linux ISOs, of course
                url: https://qb.${BASE_HOST}/
                icon: sh:qbittorrent
              - title: Radarr
                url: https://rad.${BASE_HOST}/
                icon: sh:radarr
              - title: Sonarr
                url: https://son.${BASE_HOST}/
                icon: sh:sonarr
              - title: Prowlarr
                url: https://prowl.${BASE_HOST}/
                icon: sh:prowlarr
              # - title: AdGuard Home
              #   url: https://ag.${BASE_HOST}/
              #   icon: sh:adguard-home
              - title: Komodo
                url: https://komo.${BASE_HOST}/
                icon: sh:komodo-light
              - title: Portainer
                url: https://portainer.${BASE_HOST}/
                icon: sh:portainer-pink
              - title: Backrest
                url: https://backrest.${BASE_HOST}/
                icon: sh:backrest-light
              # hide-header: true
          - $include: qb.yml

      - size: small
        widgets:
          - $include: media-server.yml
          - $include: gluetun.yml
          - $include: media-releases.yml

  # Add more pages here:
