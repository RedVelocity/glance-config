- type: custom-api
  title: Jellyseerr Requests
  frameless: true
  cache: 5m
  options:
    base-url: https://js.${BASE_HOST}
    api-key: ${SEERR_API_KEY}
    limit: 10
  template: |
    {{ $baseURL := .Options.StringOr "base-url" "" }}
    {{ $apiKey := .Options.StringOr "api-key" "" }}
    {{ $limit := .Options.IntOr "limit" 10 }}

    {{ define "errorMsg" }}
      <div class="widget-error-header">
        <div class="color-negative size-h3">ERROR</div>
      </div>
      <p class="break-all">{{ . }}</p>
    {{ end }}

    {{ if or (eq $baseURL "") (eq $apiKey "") }}
      {{ template "errorMsg" "Missing Jellyseerr base-url or api-key" }}
    {{ else }}
      {{ $req := newRequest (concat $baseURL "/api/v1/request")
        | withHeader "X-Api-Key" $apiKey
        | withHeader "Accept" "application/json"
        | getResponse }}

      {{ if ne $req.Response.StatusCode 200 }}
        {{ template "errorMsg" "Failed to fetch Jellyseerr requests" }}
      {{ else }}
        {{ $items := $req.JSON.Array "results" }}

        <div class="carousel-container" style="height: 450px; overflow-y:scroll; overflow-x: clip">
          <div class="cards-vertical carousel-items-container">

            {{ range $i, $item := $items }}
              {{ if lt $i $limit }}

                {{ $type := $item.String "type" }}
                {{ $status := $item.Int "media.status" }}
                {{ $requestedBy := $item.String "requestedBy.displayName" }}
                {{ $tmdbId := $item.Int "media.tmdbId" }}
                {{ $mediaType := $item.String "media.mediaType" }}

                {{ $statusText := "Unknown" }}
                {{ $statusColor := "var(--color-background)" }}
                {{ if eq $status 2 }} {{ $statusText = "Pending" }} {{ $statusColor = "var(--color-warning)" }}
                {{ else if eq $status 3 }} {{ $statusText = "Processing" }} {{ $statusColor = "var(--color-info)" }}
                {{ else if eq $status 4 }} {{ $statusText = "Partial" }} {{ $statusColor = "var(--color-positive)" }}
                {{ else if eq $status 5 }} {{ $statusText = "Available" }} {{ $statusColor = "var(--color-positive)" }}
                {{ else if eq $status 6 }} {{ $statusText = "Declined" }} {{ $statusColor = "var(--color-negative)" }}
                {{ else if eq $status 7 }} {{ $statusText = "Deleted" }} {{ $statusColor = "var(--color-negative)" }}
                {{ end }}

                {{ $title := $item.String "media.externalServiceSlug" }}
                {{ $posterPath := "" }}
                {{ $backdropPath := "" }}

                {{ if and $tmdbId (gt $tmdbId 0) }}
                  {{ $tmdbReq := newRequest (concat $baseURL "/api/v1/" $mediaType "/" (printf "%d" $tmdbId))
                    | withHeader "X-Api-Key" $apiKey
                    | withHeader "Accept" "application/json"
                    | getResponse }}
                  {{ if eq $tmdbReq.Response.StatusCode 200 }}
                    {{ $tmdbJSON := $tmdbReq.JSON }}
                    {{ $tmdbTitle := $tmdbJSON.String "title" }}
                    {{ if eq $tmdbTitle "" }} {{ $tmdbTitle = $tmdbJSON.String "name" }} {{ end }}
                    {{ if ne $tmdbTitle "" }} {{ $title = $tmdbTitle }} {{ end }}
                    {{ $posterPath = $tmdbJSON.String "posterPath" }}
                    {{ $backdropPath = $tmdbJSON.String "backdropPath" }}
                  {{ end }}
                {{ end }}

                {{ $posterURL := "" }}
                {{ $backdropURL := "" }}
                {{ if $posterPath }} {{ $posterURL = concat "https://image.tmdb.org/t/p/w342" $posterPath }} {{ end }}
                {{ if $backdropPath }} {{ $backdropURL = concat "https://image.tmdb.org/t/p/w780" $backdropPath }} {{ end }}

                <div class="card widget-content-frame" style="{{ if $backdropURL }}background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.80)), url('{{ $backdropURL }}'); background-size: cover; background-position: center;{{ end }};">

                  <div class="flex gap-12">
                    {{ if $posterURL }}
                      <img src="{{ $posterURL }}" loading="lazy" style="width: 50px; aspect-ratio: 2/3; object-fit: cover; border-top-left-radius: var(--border-radius); border-bottom-left-radius: var(--border-radius);" />
                    {{ end }}

                    <div class="flex flex-column justify-evenly grow">
                      <a href="{{$baseURL}}/{{ $type }}/{{ $tmdbId }}" target="_blank" class="size-title-dynamic color-highlight growsize-title-dynamic">
                        <span title="{{ $title }}" style="text-wrap:auto;">{{ $title }}</span>
                      </a>

                      <div class="list-horizontal-text">
                        <span style="text-transform: capitalize;">{{ $type }}</span>
                        <span style="background-color: var(--color-background); padding-inline: 4px; border-radius: var(--border-radius);">
                          {{ $statusText }}
                        </span>
                      </div>

                      <span class="text-truncate">
                        {{ $requestedBy }}
                      </span>
                    </div>
                  </div>

                </div>

              {{ end }}
            {{ end }}

          </div>
        </div>

      {{ end }}
    {{ end }}
