- type: custom-api
  title: VPN status
  update-interval: 5m
  url: https://gt.${BASE_HOST}/v1/publicip/ip
  headers:
    X-API-Key: ${GLUETUN_API_KEY}
  template: "{{ if eq .Response.StatusCode 200 }}\n  {{ $ip := (.JSON.String \"public_ip\") }}\n  {{ $city := (.JSON.String \"city\") }}\n  {{ $country := (.JSON.String \"country\") }}\n  {{ if eq $ip \"\" }}\n          <div class=\"color-highlight size-h3\">\n            VPN Not Connected\n            <span class=\"color-negative\">●</span> \n          </div>\n  {{ else }}\n      <div>\n          <div class=\"color-highlight size-h3\">\n            VPN Connected\n            <span class=\"color-positive\">●</span> \n          </div>\n        <div class=\"size-h4\">{{ $ip }} - {{ $city }}, {{ $country }}</div>\n      </div>\n  {{ end }}\n{{ else }}\n  <div class=\"text-center color-negative\">\n    Error: {{ .Response.StatusCode }} - {{ .Response.Status }}\n  </div>\n{{ end }}"
