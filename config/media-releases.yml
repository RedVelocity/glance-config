- type: custom-api
  title: Media Releases
  update-interval: 5m
  frameless: true
  options:
    interval: ${RELEASE_INTERVAL_DAYS}
    radarr-url: https://rad.${BASE_HOST}
    radarr-key: ${RADARR_KEY}
    sonarr-url: https://son.${BASE_HOST}
    sonarr-key: ${SONARR_KEY}
    exclude-physical: true
  template: |
    {{ $intervalH := .Options.IntOr "interval" 30 | mul 24 }}

    {{ $radarrUrl := .Options.StringOr "radarr-url" "" }}
    {{ $sonarrUrl := .Options.StringOr "sonarr-url" "" }}
    {{ $radarrKey := .Options.StringOr "radarr-key" "" }}
    {{ $sonarrKey := .Options.StringOr "sonarr-key" "" }}
    {{ $excludePhysical := .Options.BoolOr "exclude-physical" false }}

    {{ $now := now | formatTime "2006-01-02T15:04:05" }}
    {{ $startDate := offsetNow (printf "-%dh" $intervalH) | formatTime "2006-01-02T15:04:05" }}
    {{ $endDate := offsetNow (printf "+%dh" $intervalH) | formatTime "2006-01-02T15:04:05" }}

    {{ $radarrReq := printf "%s/api/v3/calendar?start=%s&end=%s" $radarrUrl $startDate $endDate }}
    {{ $sonarrReq := printf "%s/api/v3/calendar?includeSeries=true&start=%s&end=%s" $sonarrUrl $now $endDate }}

    {{ $radarrData := newRequest $radarrReq
      | withHeader "Accept" "application/json"
      | withHeader "X-Api-Key" $radarrKey
      | getResponse }}

    {{ $sonarrData := newRequest $sonarrReq
      | withHeader "Accept" "application/json"
      | withHeader "X-Api-Key" $sonarrKey
      | getResponse }}

    {{ if and (eq $radarrData.Response.StatusCode 200) (eq $sonarrData.Response.StatusCode 200) }}

    <div class="carousel-container show-right-cutoff">
      <div class="cards-horizontal carousel-items-container">

        {{/* ============================================================
             MOVIES

             Select the LATEST eligible release date in the interval.

             This means a movie can have:
               Cinema       -> June 17
               Digital      -> August 18

             and will correctly display Digital / August 18.

             If physical releases are excluded, physical dates are
             completely ignored.
             ============================================================ */}}

        {{ range $radarrData.JSON.Array "" | sortByTime "releaseDate" "rfc3339" "asc" }}

          {{ $title := .String "title" }}
          {{ $id := .Int "id" }}
          {{ $titleSlug := .String "titleSlug" }}

          {{ $coverUrl := printf "%s/api/v3/mediacover/%d/poster-500.jpg?apikey=%s" $radarrUrl $id $radarrKey }}
          {{ $link := printf "%s/movie/%s" $radarrUrl $titleSlug }}

          {{ $releaseDate := "" }}
          {{ if .Exists "releaseDate" }}
            {{ $releaseDate = .String "releaseDate" }}
          {{ end }}

          {{ $inCinemas := "" }}
          {{ if .Exists "inCinemas" }}
            {{ $inCinemas = .String "inCinemas" }}
          {{ end }}

          {{ $digitalRelease := "" }}
          {{ if .Exists "digitalRelease" }}
            {{ $digitalRelease = .String "digitalRelease" }}
          {{ end }}

          {{ $physicalRelease := "" }}
          {{ if .Exists "physicalRelease" }}
            {{ $physicalRelease = .String "physicalRelease" }}
          {{ end }}

          {{ $selectedDate := "" }}
          {{ $releaseType := "" }}

          {{/* ========================================================
               In Cinemas
               ======================================================== */}}

          {{ if and
              (ne $inCinemas "")
              (ge $inCinemas $startDate)
              (le $inCinemas $endDate)
            }}
            {{ $selectedDate = $inCinemas }}
            {{ $releaseType = "In Cinemas" }}
          {{ end }}

          {{/* ========================================================
               Digital

               Digital replaces cinema if it is later.
               ======================================================== */}}

          {{ if and
              (ne $digitalRelease "")
              (ge $digitalRelease $startDate)
              (le $digitalRelease $endDate)
            }}
            {{ if or
                (eq $selectedDate "")
                (gt $digitalRelease $selectedDate)
              }}
              {{ $selectedDate = $digitalRelease }}
              {{ $releaseType = "Digital" }}
            {{ end }}
          {{ end }}

          {{/* ========================================================
               Physical

               Completely ignored when exclude-physical = true.
               ======================================================== */}}

          {{ if not $excludePhysical }}

            {{ if and
                (ne $physicalRelease "")
                (ge $physicalRelease $startDate)
                (le $physicalRelease $endDate)
              }}
              {{ if or
                  (eq $selectedDate "")
                  (gt $physicalRelease $selectedDate)
                }}
                {{ $selectedDate = $physicalRelease }}
                {{ $releaseType = "Physical" }}
              {{ end }}
            {{ end }}

          {{ end }}

          {{/* ========================================================
               Generic releaseDate

               Only use it if it is newer than the selected release.
               ======================================================== */}}

          {{ if and
              (ne $releaseDate "")
              (ge $releaseDate $startDate)
              (le $releaseDate $endDate)
            }}

            {{ if or
                (eq $selectedDate "")
                (gt $releaseDate $selectedDate)
              }}
              {{ $selectedDate = $releaseDate }}
              {{ $releaseType = "Release" }}
            {{ end }}

          {{ end }}

          {{/* ========================================================
               Render movie
               ======================================================== */}}

          {{ if ne $selectedDate "" }}

            {{ if or
                (not $excludePhysical)
                (ne $releaseType "Physical")
              }}

              {{ $dateStr := $selectedDate | parseTime "RFC3339" | formatTime "Mon, 2-Jan" }}

              <div class="card widget-content-frame">

                <img src="{{ $coverUrl }}"
                  alt="{{ $title }}"
                  loading="lazy"
                  style="object-fit: cover; border-radius: var(--border-radius) var(--border-radius) 0 0; aspect-ratio: 2/3;"
                />

                <ul class="flex flex-column justify-evenly margin-bottom-10 margin-top-10 padding-inline-widget" style="height: 100%;">

                  <li class="text-truncate color-primary">
                    <a href="{{ $link }}" target="_blank" style="text-decoration: none;">
                      {{ $title }}
                    </a>
                  </li>

                  <li class="text-truncate size-sm">
                    {{ $releaseType }}
                  </li>

                  <li class="text-truncate size-sm">
                    {{ $dateStr }}
                  </li>

                </ul>

              </div>

            {{ end }}

          {{ end }}

        {{ end }}


        {{/* ============================================================
             SERIES / EPISODES
             ============================================================ */}}

        {{ range $sonarrData.JSON.Array "" | sortByTime "airDateUtc" "rfc3339" "asc" }}

          {{ $seriesId := .Int "seriesId" }}

          {{ $coverUrl := printf "%s/api/v3/mediacover/%d/poster-500.jpg?apikey=%s" $sonarrUrl $seriesId $sonarrKey }}

          {{ $title := "" }}
          {{ if .Exists "series.title" }}
            {{ $title = .String "series.title" }}
          {{ end }}

          {{ $titleSlug := "" }}
          {{ if .Exists "series.titleSlug" }}
            {{ $titleSlug = .String "series.titleSlug" }}
          {{ end }}

          {{ $link := printf "%s/series/%s" $sonarrUrl $titleSlug }}

          {{ $date := .String "airDateUtc" | parseTime "RFC3339" }}

          {{ $seString := printf "S%02dE%02d" (.Int "seasonNumber") (.Int "episodeNumber") }}

          {{ $episodeTitle := .String "title" }}

          {{ $dateStr := $date.Format "Mon, 2-Jan 15:04" }}

          <div class="card widget-content-frame">

            <img src="{{ $coverUrl }}"
              alt="{{ $title }}"
              loading="lazy"
              style="object-fit: cover; border-radius: var(--border-radius) var(--border-radius) 0 0; aspect-ratio: 2/3;"
            />

            <ul class="flex flex-column justify-evenly margin-bottom-10 margin-top-10 padding-inline-widget" style="height: 100%;">

              <li class="text-truncate color-primary">
                <a href="{{ $link }}" target="_blank" style="text-decoration: none;">
                  {{ $title }}
                </a>
              </li>

              <li class="text-truncate size-sm">
                {{ $seString }} | {{ $episodeTitle }}
              </li>

              <li class="text-truncate size-sm">
                {{ $dateStr }}
              </li>

            </ul>

          </div>

        {{ end }}

      </div>
    </div>

    {{ else }}

    <div class="widget-error widget-content">
      <div class="widget-error-header">
        <div class="color-negative size-h3">ERROR</div>

        <svg class="widget-error-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378 2.697 16.126ZM12 15.75h.007v.008H12v-.008Z">
          </path>

        </svg>
      </div>

      <p class="size-sm">Failed to fetch data.</p>
    </div>

    {{ end }}
