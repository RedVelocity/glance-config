- type: custom-api
  # cache: 10s
  update-interval: 30s
  title: qBittorrent
  hide-header: true
  options:
    collapse-after: ${QBIT_COLLAPSE_AFTER}
  subrequests:
    transfer:
      url: http://${QBIT_HOST}/api/v2/transfer/info
    seeding:
      url: http://${QBIT_HOST}/api/v2/torrents/info
      parameters:
        filter: seeding
    leeching:
      url: http://${QBIT_HOST}/api/v2/torrents/info
      parameters:
        filter: downloading
  template: |
    {{ $transfer := .Subrequest "transfer" }}
    {{ $seeding := .Subrequest "seeding" }}
    {{ $leeching := .Subrequest "leeching" }}
    {{ $collapseAfter := .Options.IntOr "collapse-after" 4 }}

    {{ if and (eq $transfer.Response.StatusCode 200) (eq $seeding.Response.StatusCode 200) (eq $leeching.Response.StatusCode 200) }}
      {{ $downloadingTorrents := $leeching.JSON.Array "" }}
      {{ $seedingTorrents := $seeding.JSON.Array "" }}
        {{ $hasItems := or (gt (len $downloadingTorrents) 0) (gt (len $seedingTorrents) 0) }}{{ $hasItems := or (gt (len $downloadingTorrents) 0) (gt (len $seedingTorrents) 0) }}
        {{ if not $hasItems }}
        <div class="widget-error">
          <div class="widget-error-header">
            <div class="color-warning size-h3">WARNING</div>
            <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" style="stroke: var(--color-warning);">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
            </svg>
          </div>
          <p class="size-sm">No active torrents.</p>
        </div>
      {{ else }}      
      <div class="list" style="--list-gap:15px;">
        <style>
          @media (max-width: 768px) {
            .mobile-hide { display: none !important; }
            .header-grid { grid-template-columns: 40px 1.2fr 60px 60px 60px !important; }
            .torrent-grid { grid-template-columns: 40px 1.2fr 60px 60px 60px !important; }
          }
        </style>
        <div class="header-grid" style="display:grid; grid-template-columns:40px 1.2fr 1fr 100px 80px 80px; gap:8px; padding:8px 0; border-bottom:1px solid #3B404E; font-weight:700; align-items:center;">
          <span></span>
          <span>Name</span>
          <span>Progress</span>
          <span>Status</span>
          <span class="mobile-hide">Size</span>
          <span>Speed</span>
        </div>

        <ul class="list collapsible-container" data-collapse-after={{ $collapseAfter }} style="--list-gap:15px; margin:0; padding:0; list-style:none; margin-top:6px;">
          {{/* Active downloading torrents first */}}
          {{ range $t := $downloadingTorrents }}
            {{ $state := $t.String "state" }}
            {{ $dlSpeed := $t.Float "dlspeed" }}
            {{ if and $dlSpeed (or (eq $state "downloading") (eq $state "metaDL") (eq $state "forcedDL")) }}
              {{ if gt $dlSpeed 0.0 }}
                  {{ $status := $state }}
                  {{ if eq $state "metaDL" }}{{ $status = "metadata" }}{{ else if or (eq $state "stalledUP") (eq $state "stalledDL") }}{{ $status = "stalled" }}{{ else if or (eq $state "pausedUP") (eq $state "pausedDL") }}{{ $status = "paused" }}{{ else if or (eq $state "stoppedUP") (eq $state "stoppedDL") }}{{ $status = "stopped" }}{{ else if or (eq $state "queuedUP") (eq $state "queuedDL") }}{{ $status = "queued" }}{{ else if or (eq $state "error") (eq $state "missingFiles") }}{{ $status = "error" }}{{ else if or (eq $state "checkingUP") (eq $state "checkingDL") (eq $state "checkingResumeData") (eq $state "allocating") }}{{ $status = "checking" }}{{ end }}
                  
                  <li style="border-bottom:0.5px solid #3B404E; padding:10px 0;">
                    <div class="torrent-grid" style="display:grid; grid-template-columns:40px 1.2fr 1fr 100px 80px 80px; gap:8px; align-items:center; width:100%;">
                      <span>↓</span>
                      <span title="{{ $t.String "name" }}" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ $t.String "name" }}</span>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <div class="mobile-hide" style="background: rgba(128,128,128,0.12); height:8px; border-radius:4px; width:100%;">
                          <div style="width: {{ $t.Float "progress" | mul 100 }}%; background-color: {{ if lt ($t.Float "progress") 1.0 }}var(--color-info){{ else }}var(--color-positive){{ end }}; height:100%; border-radius:4px;"></div>
                        </div>
                        <span style="min-width:48px;">{{ $t.Float "progress" | mul 100 | printf "%.1f" }}%</span>
                      </div>
                      <span style="text-transform: capitalize;">{{ $status }}</span>
                      <span class="mobile-hide">
                        {{ $size := $t.Float "size" }}
                        {{ if lt $size 1073741824.0 }}
                          {{ printf "%.1f MB" (div $size 1048576.0) }}
                        {{ else }}
                          {{ printf "%.1f GB" (div $size 1073741824.0) }}
                        {{ end }}
                      </span>
                      <span style="width:80px;">
                        {{ if lt $dlSpeed 1000.0 }}-- KB/s
                        {{ else if lt $dlSpeed 1000000.0 }}{{ printf "%.0f KB/s" (div $dlSpeed 1000.0) }}
                        {{ else }}{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}{{ end }}
                      </span>
                    </div>
                  </li>
              {{ end }}
            {{ end }}
          {{ end }}
          
          {{/* Active seeding torrents second */}}
          {{ range $t := $seedingTorrents }}
            {{ $state := $t.String "state" }}
            {{ $ulSpeed := $t.Float "upspeed" }}
            {{ if and $ulSpeed (or (eq $state "uploading") (eq $state "stalledUP") (eq $state "forcedUP")) }}
              {{ if gt $ulSpeed 0.0 }}
                  {{ $status := $state }}
                  {{ if eq $state "metaDL" }}{{ $status = "metadata" }}{{ else if or (eq $state "stalledUP") (eq $state "stalledDL") }}{{ $status = "stalled" }}{{ else if or (eq $state "pausedUP") (eq $state "pausedDL") }}{{ $status = "paused" }}{{ else if or (eq $state "stoppedUP") (eq $state "stoppedDL") }}{{ $status = "stopped" }}{{ else if or (eq $state "queuedUP") (eq $state "queuedDL") }}{{ $status = "queued" }}{{ else if or (eq $state "error") (eq $state "missingFiles") }}{{ $status = "error" }}{{ else if or (eq $state "checkingUP") (eq $state "checkingDL") (eq $state "checkingResumeData") (eq $state "allocating") }}{{ $status = "checking" }}{{ end }}
                  
                  <li style="border-bottom:0.5px solid #3B404E; padding:10px 0;">
                    <div class="torrent-grid" style="display:grid; grid-template-columns:40px 1.2fr 1fr 100px 80px 80px; gap:8px; align-items:center; width:100%;">
                      <span>↑</span>
                      <span title="{{ $t.String "name" }}" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ $t.String "name" }}</span>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <div class="mobile-hide" style="background: rgba(128,128,128,0.12); height:8px; border-radius:4px; width:100%;">
                          <div style="width: {{ $t.Float "progress" | mul 100 }}%; background-color: {{ if lt ($t.Float "progress") 1.0 }}var(--color-info){{ else }}var(--color-positive){{ end }}; height:100%; border-radius:4px;"></div>
                        </div>
                        <span style="min-width:48px;">{{ $t.Float "progress" | mul 100 | printf "%.1f" }}%</span>
                      </div>
                      <span style="text-transform: capitalize;">{{ $status }}</span>
                      <span class="mobile-hide">
                        {{ $size := $t.Float "size" }}
                        {{ if lt $size 1073741824.0 }}
                          {{ printf "%.1f MB" (div $size 1048576.0) }}
                        {{ else }}
                          {{ printf "%.1f GB" (div $size 1073741824.0) }}
                        {{ end }}
                      </span>
                      <span style="width:80px;">
                        {{ if lt $ulSpeed 1000.0 }}-- KB/s
                        {{ else if lt $ulSpeed 1000000.0 }}{{ printf "%.0f KB/s" (div $ulSpeed 1000.0) }}
                        {{ else }}{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}{{ end }}
                      </span>
                    </div>
                  </li>
              {{ end }}
            {{ end }}
          {{ end }}
          
          {{/* Inactive downloading torrents third */}}
          {{ range $t := $downloadingTorrents }}
            {{ $state := $t.String "state" }}
            {{ $dlSpeed := $t.Float "dlspeed" }}
            {{ $isActive := false }}
            {{ if and $dlSpeed (or (eq $state "downloading") (eq $state "metaDL") (eq $state "forcedDL")) }}
              {{ if gt $dlSpeed 0.0 }}
                {{ $isActive = true }}
              {{ end }}
            {{ end }}
            {{ if not $isActive }}
              {{ $status := $state }}
              {{ if eq $state "metaDL" }}{{ $status = "metadata" }}{{ else if or (eq $state "stalledUP") (eq $state "stalledDL") }}{{ $status = "stalled" }}{{ else if or (eq $state "pausedUP") (eq $state "pausedDL") }}{{ $status = "paused" }}{{ else if or (eq $state "stoppedUP") (eq $state "stoppedDL") }}{{ $status = "stopped" }}{{ else if or (eq $state "queuedUP") (eq $state "queuedDL") }}{{ $status = "queued" }}{{ else if or (eq $state "error") (eq $state "missingFiles") }}{{ $status = "error" }}{{ else if or (eq $state "checkingUP") (eq $state "checkingDL") (eq $state "checkingResumeData") (eq $state "allocating") }}{{ $status = "checking" }}{{ end }}
              
              <li style="border-bottom:0.5px solid #3B404E; padding:10px 0;">
                <div class="torrent-grid" style="display:grid; grid-template-columns:40px 1.2fr 1fr 100px 80px 80px; gap:8px; align-items:center; width:100%;">
                  <span>↓</span>
                  <span title="{{ $t.String "name" }}" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ $t.String "name" }}</span>
                  <div style="display:flex; align-items:center; gap:8px;">
                    <div class="mobile-hide" style="background: rgba(128,128,128,0.12); height:8px; border-radius:4px; width:100%;">
                      <div style="width: {{ $t.Float "progress" | mul 100 }}%; background-color: {{ if lt ($t.Float "progress") 1.0 }}var(--color-info){{ else }}var(--color-positive){{ end }}; height:100%; border-radius:4px;"></div>
                    </div>
                    <span style="min-width:48px;">{{ $t.Float "progress" | mul 100 | printf "%.1f" }}%</span>
                  </div>
                  <span style="text-transform: capitalize;">{{ $status }}</span>
                  <span class="mobile-hide">
                    {{ $size := $t.Float "size" }}
                    {{ if lt $size 1073741824.0 }}
                      {{ printf "%.1f MB" (div $size 1048576.0) }}
                    {{ else }}
                      {{ printf "%.1f GB" (div $size 1073741824.0) }}
                    {{ end }}
                  </span>
                  <span style="width:80px;">
                    {{ if $dlSpeed }}
                      {{ if lt $dlSpeed 1000.0 }}-- KB/s
                      {{ else if lt $dlSpeed 1000000.0 }}{{ printf "%.0f KB/s" (div $dlSpeed 1000.0) }}
                      {{ else }}{{ printf "%.1f MB/s" (div $dlSpeed 1000000.0) }}{{ end }}
                    {{ else }}-- KB/s{{ end }}
                  </span>
                </div>
              </li>
            {{ end }}
          {{ end }}
          
          {{/* Inactive seeding torrents last */}}
          {{ range $t := $seedingTorrents }}
            {{ $state := $t.String "state" }}
            {{ $ulSpeed := $t.Float "upspeed" }}
            {{ $isActive := false }}
            {{ if and $ulSpeed (or (eq $state "uploading") (eq $state "stalledUP") (eq $state "forcedUP")) }}
              {{ if gt $ulSpeed 0.0 }}
                {{ $isActive = true }}
              {{ end }}
            {{ end }}
            {{ if not $isActive }}
              {{ $status := $state }}
              {{ if eq $state "metaDL" }}{{ $status = "metadata" }}{{ else if or (eq $state "stalledUP") (eq $state "stalledDL") }}{{ $status = "stalled" }}{{ else if or (eq $state "pausedUP") (eq $state "pausedDL") }}{{ $status = "paused" }}{{ else if or (eq $state "stoppedUP") (eq $state "stoppedDL") }}{{ $status = "stopped" }}{{ else if or (eq $state "queuedUP") (eq $state "queuedDL") }}{{ $status = "queued" }}{{ else if or (eq $state "error") (eq $state "missingFiles") }}{{ $status = "error" }}{{ else if or (eq $state "checkingUP") (eq $state "checkingDL") (eq $state "checkingResumeData") (eq $state "allocating") }}{{ $status = "checking" }}{{ end }}
              
              <li style="border-bottom:0.5px solid #3B404E; padding:10px 0;">
                <div class="torrent-grid" style="display:grid; grid-template-columns:40px 1.2fr 1fr 100px 80px 80px; gap:8px; align-items:center; width:100%;">
                  <span>↑</span>
                  <span title="{{ $t.String "name" }}" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ $t.String "name" }}</span>
                  <div style="display:flex; align-items:center; gap:8px;">
                    <div class="mobile-hide" style="background: rgba(128,128,128,0.12); height:8px; border-radius:4px; width:100%;">
                      <div style="width: {{ $t.Float "progress" | mul 100 }}%; background-color: {{ if lt ($t.Float "progress") 1.0 }}var(--color-info){{ else }}var(--color-positive){{ end }}; height:100%; border-radius:4px;"></div>
                    </div>
                    <span style="min-width:48px;">{{ $t.Float "progress" | mul 100 | printf "%.1f" }}%</span>
                  </div>
                  <span style="text-transform: capitalize;">{{ $status }}</span>
                  <span class="mobile-hide">
                    {{ $size := $t.Float "size" }}
                    {{ if lt $size 1073741824.0 }}
                      {{ printf "%.1f MB" (div $size 1048576.0) }}
                    {{ else }}
                      {{ printf "%.1f GB" (div $size 1073741824.0) }}
                    {{ end }}
                  </span>
                  <span style="width:80px;">
                    {{ if $ulSpeed }}
                      {{ if lt $ulSpeed 1000.0 }}-- KB/s
                      {{ else if lt $ulSpeed 1000000.0 }}{{ printf "%.0f KB/s" (div $ulSpeed 1000.0) }}
                      {{ else }}{{ printf "%.1f MB/s" (div $ulSpeed 1000000.0) }}{{ end }}
                    {{ else }}-- KB/s{{ end }}
                  </span>
                </div>
              </li>
            {{ end }}
          {{ end }}
        </ul>
      </div>
    {{ end }}
    {{ else }}
        <div class="widget-error">
          <div class="widget-error-header">
            <div class="color-negative size-h3">ERROR</div>
            <svg class="widget-error-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"></path>
            </svg>
          </div>
          <p class="size-sm">Error fetching qBittorrent data.</p>
        </div>
    {{ end }}
