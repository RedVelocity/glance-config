- type: custom-api
  # cache: 10s
  update-interval: 30s
  title: qBittorrent
  hide-header: true
  options:
    collapse-after: ${QBIT_COLLAPSE_AFTER}
  subrequests:
    transfer:
      url: ${QBIT_HOST}/api/v2/transfer/info
    seeding:
      url: ${QBIT_HOST}/api/v2/torrents/info
      parameters:
        filter: seeding
    leeching:
      url: ${QBIT_HOST}/api/v2/torrents/info
      parameters:
        filter: downloading
  template: "{{ $transfer := .Subrequest \"transfer\" }}\n{{ $seeding := .Subrequest \"seeding\" }}\n{{ $leeching := .Subrequest \"leeching\" }}\n{{ $collapseAfter := .Options.IntOr \"collapse-after\" 4 }}\n\n{{ if and (eq $transfer.Response.StatusCode 200) (eq $seeding.Response.StatusCode 200) (eq $leeching.Response.StatusCode 200) }}\n  {{ $downloadingTorrents := $leeching.JSON.Array \"\" }}\n  {{ $seedingTorrents := $seeding.JSON.Array \"\" }}\n    {{ $hasItems := or (gt (len $downloadingTorrents) 0) (gt (len $seedingTorrents) 0) }}{{ $hasItems := or (gt (len $downloadingTorrents) 0) (gt (len $seedingTorrents) 0) }}\n    {{ if not $hasItems }}\n    <div class=\"widget-error\">\n      <div class=\"widget-error-header\">\n        <div class=\"color-warning size-h3\">WARNING</div>\n        <svg class=\"widget-error-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.5\" style=\"stroke: var(--color-warning);\">\n          <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z\"></path>\n        </svg>\n      </div>\n      <p class=\"size-sm\">No active torrents.</p>\n    </div>\n  {{ else }}      \n  <div class=\"list\" style=\"--list-gap:15px;\">\n    <style>\n      .collapsible-container > li:last-child { border-bottom: none !important; }\n      @media (max-width: 768px) {\n        .mobile-hide { display: none !important; }\n        .header-grid { grid-template-columns: 40px 1.2fr 60px 60px 60px !important; }\n        .torrent-grid { grid-template-columns: 40px 1.2fr 60px 60px 60px !important; }\n      }\n    </style>\n    <div class=\"header-grid\" style=\"display:grid; grid-template-columns:40px 1.2fr 1fr 100px 80px 80px; gap:8px; padding:8px 0; border-bottom:1px solid #3B404E; font-weight:700; align-items:center;\">\n      <span></span>\n      <span>Name</span>\n      <span>Progress</span>\n      <span>Status</span>\n      <span class=\"mobile-hide\">Size</span>\n      <span>Speed</span>\n    </div>\n\n    <ul class=\"list collapsible-container\" data-collapse-after={{ $collapseAfter }} style=\"--list-gap:15px; margin:0; padding:0; list-style:none; margin-top:6px;\">\n      {{/* Active downloading torrents first */}}\n      {{ range $t := $downloadingTorrents }}\n        {{ $state := $t.String \"state\" }}\n        {{ $dlSpeed := $t.Float \"dlspeed\" }}\n        {{ if and $dlSpeed (or (eq $state \"downloading\") (eq $state \"metaDL\") (eq $state \"forcedDL\")) }}\n          {{ if gt $dlSpeed 0.0 }}\n              {{ $status := $state }}\n              {{ if eq $state \"metaDL\" }}{{ $status = \"metadata\" }}{{ else if or (eq $state \"stalledUP\") (eq $state \"stalledDL\") }}{{ $status = \"stalled\" }}{{ else if or (eq $state \"pausedUP\") (eq $state \"pausedDL\") }}{{ $status = \"paused\" }}{{ else if or (eq $state \"stoppedUP\") (eq $state \"stoppedDL\") }}{{ $status = \"stopped\" }}{{ else if or (eq $state \"queuedUP\") (eq $state \"queuedDL\") }}{{ $status = \"queued\" }}{{ else if or (eq $state \"error\") (eq $state \"missingFiles\") }}{{ $status = \"error\" }}{{ else if or (eq $state \"checkingUP\") (eq $state \"checkingDL\") (eq $state \"checkingResumeData\") (eq $state \"allocating\") }}{{ $status = \"checking\" }}{{ end }}\n              \n              <li style=\"border-bottom:0.5px solid #3B404E; padding:10px 0;\">\n                <div class=\"torrent-grid\" style=\"display:grid; grid-template-columns:40px 1.2fr 1fr 100px 80px 80px; gap:8px; align-items:center; width:100%;\">\n                  <span>↓</span>\n                  <span title=\"{{ $t.String \"name\" }}\" style=\"overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ $t.String \"name\" }}</span>\n                  <div style=\"display:flex; align-items:center; gap:8px;\">\n                    <div class=\"mobile-hide\" style=\"background: rgba(128,128,128,0.12); height:8px; border-radius:4px; width:100%;\">\n                      <div style=\"width: {{ $t.Float \"progress\" | mul 100 }}%; background-color: {{ if lt ($t.Float \"progress\") 1.0 }}var(--color-info){{ else }}var(--color-positive){{ end }}; height:100%; border-radius:4px;\"></div>\n                    </div>\n                    <span style=\"min-width:48px;\">{{ $t.Float \"progress\" | mul 100 | printf \"%.1f\" }}%</span>\n                  </div>\n                  <span style=\"text-transform: capitalize;\">{{ $status }}</span>\n                  <span class=\"mobile-hide\">\n                    {{ $size := $t.Float \"size\" }}\n                    {{ if lt $size 1073741824.0 }}\n                      {{ printf \"%.1f MB\" (div $size 1048576.0) }}\n                    {{ else }}\n                      {{ printf \"%.1f GB\" (div $size 1073741824.0) }}\n                    {{ end }}\n                  </span>\n                  <span style=\"width:80px;\">\n                    {{ if lt $dlSpeed 1000.0 }}-- KB/s\n                    {{ else if lt $dlSpeed 1000000.0 }}{{ printf \"%.0f KB/s\" (div $dlSpeed 1000.0) }}\n                    {{ else }}{{ printf \"%.1f MB/s\" (div $dlSpeed 1000000.0) }}{{ end }}\n                  </span>\n                </div>\n              </li>\n          {{ end }}\n        {{ end }}\n      {{ end }}\n      \n      {{/* Active seeding torrents second */}}\n      {{ range $t := $seedingTorrents }}\n        {{ $state := $t.String \"state\" }}\n        {{ $ulSpeed := $t.Float \"upspeed\" }}\n        {{ if and $ulSpeed (or (eq $state \"uploading\") (eq $state \"stalledUP\") (eq $state \"forcedUP\")) }}\n          {{ if gt $ulSpeed 0.0 }}\n              {{ $status := $state }}\n              {{ if eq $state \"metaDL\" }}{{ $status = \"metadata\" }}{{ else if or (eq $state \"stalledUP\") (eq $state \"stalledDL\") }}{{ $status = \"stalled\" }}{{ else if or (eq $state \"pausedUP\") (eq $state \"pausedDL\") }}{{ $status = \"paused\" }}{{ else if or (eq $state \"stoppedUP\") (eq $state \"stoppedDL\") }}{{ $status = \"stopped\" }}{{ else if or (eq $state \"queuedUP\") (eq $state \"queuedDL\") }}{{ $status = \"queued\" }}{{ else if or (eq $state \"error\") (eq $state \"missingFiles\") }}{{ $status = \"error\" }}{{ else if or (eq $state \"checkingUP\") (eq $state \"checkingDL\") (eq $state \"checkingResumeData\") (eq $state \"allocating\") }}{{ $status = \"checking\" }}{{ end }}\n              \n              <li style=\"border-bottom:0.5px solid #3B404E; padding:10px 0;\">\n                <div class=\"torrent-grid\" style=\"display:grid; grid-template-columns:40px 1.2fr 1fr 100px 80px 80px; gap:8px; align-items:center; width:100%;\">\n                  <span>↑</span>\n                  <span title=\"{{ $t.String \"name\" }}\" style=\"overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ $t.String \"name\" }}</span>\n                  <div style=\"display:flex; align-items:center; gap:8px;\">\n                    <div class=\"mobile-hide\" style=\"background: rgba(128,128,128,0.12); height:8px; border-radius:4px; width:100%;\">\n                      <div style=\"width: {{ $t.Float \"progress\" | mul 100 }}%; background-color: {{ if lt ($t.Float \"progress\") 1.0 }}var(--color-info){{ else }}var(--color-positive){{ end }}; height:100%; border-radius:4px;\"></div>\n                    </div>\n                    <span style=\"min-width:48px;\">{{ $t.Float \"progress\" | mul 100 | printf \"%.1f\" }}%</span>\n                  </div>\n                  <span style=\"text-transform: capitalize;\">{{ $status }}</span>\n                  <span class=\"mobile-hide\">\n                    {{ $size := $t.Float \"size\" }}\n                    {{ if lt $size 1073741824.0 }}\n                      {{ printf \"%.1f MB\" (div $size 1048576.0) }}\n                    {{ else }}\n                      {{ printf \"%.1f GB\" (div $size 1073741824.0) }}\n                    {{ end }}\n                  </span>\n                  <span style=\"width:80px;\">\n                    {{ if lt $ulSpeed 1000.0 }}-- KB/s\n                    {{ else if lt $ulSpeed 1000000.0 }}{{ printf \"%.0f KB/s\" (div $ulSpeed 1000.0) }}\n                    {{ else }}{{ printf \"%.1f MB/s\" (div $ulSpeed 1000000.0) }}{{ end }}\n                  </span>\n                </div>\n              </li>\n          {{ end }}\n        {{ end }}\n      {{ end }}\n      \n      {{/* Inactive downloading torrents third */}}\n      {{ range $t := $downloadingTorrents }}\n        {{ $state := $t.String \"state\" }}\n        {{ $dlSpeed := $t.Float \"dlspeed\" }}\n        {{ $isActive := false }}\n        {{ if and $dlSpeed (or (eq $state \"downloading\") (eq $state \"metaDL\") (eq $state \"forcedDL\")) }}\n          {{ if gt $dlSpeed 0.0 }}\n            {{ $isActive = true }}\n          {{ end }}\n        {{ end }}\n        {{ if not $isActive }}\n          {{ $status := $state }}\n          {{ if eq $state \"metaDL\" }}{{ $status = \"metadata\" }}{{ else if or (eq $state \"stalledUP\") (eq $state \"stalledDL\") }}{{ $status = \"stalled\" }}{{ else if or (eq $state \"pausedUP\") (eq $state \"pausedDL\") }}{{ $status = \"paused\" }}{{ else if or (eq $state \"stoppedUP\") (eq $state \"stoppedDL\") }}{{ $status = \"stopped\" }}{{ else if or (eq $state \"queuedUP\") (eq $state \"queuedDL\") }}{{ $status = \"queued\" }}{{ else if or (eq $state \"error\") (eq $state \"missingFiles\") }}{{ $status = \"error\" }}{{ else if or (eq $state \"checkingUP\") (eq $state \"checkingDL\") (eq $state \"checkingResumeData\") (eq $state \"allocating\") }}{{ $status = \"checking\" }}{{ end }}\n          \n          <li style=\"border-bottom:0.5px solid #3B404E; padding:10px 0;\">\n            <div class=\"torrent-grid\" style=\"display:grid; grid-template-columns:40px 1.2fr 1fr 100px 80px 80px; gap:8px; align-items:center; width:100%;\">\n              <span>↓</span>\n              <span title=\"{{ $t.String \"name\" }}\" style=\"overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ $t.String \"name\" }}</span>\n              <div style=\"display:flex; align-items:center; gap:8px;\">\n                <div class=\"mobile-hide\" style=\"background: rgba(128,128,128,0.12); height:8px; border-radius:4px; width:100%;\">\n                  <div style=\"width: {{ $t.Float \"progress\" | mul 100 }}%; background-color: {{ if lt ($t.Float \"progress\") 1.0 }}var(--color-info){{ else }}var(--color-positive){{ end }}; height:100%; border-radius:4px;\"></div>\n                </div>\n                <span style=\"min-width:48px;\">{{ $t.Float \"progress\" | mul 100 | printf \"%.1f\" }}%</span>\n              </div>\n              <span style=\"text-transform: capitalize;\">{{ $status }}</span>\n              <span class=\"mobile-hide\">\n                {{ $size := $t.Float \"size\" }}\n                {{ if lt $size 1073741824.0 }}\n                  {{ printf \"%.1f MB\" (div $size 1048576.0) }}\n                {{ else }}\n                  {{ printf \"%.1f GB\" (div $size 1073741824.0) }}\n                {{ end }}\n              </span>\n              <span style=\"width:80px;\">\n                {{ if $dlSpeed }}\n                  {{ if lt $dlSpeed 1000.0 }}-- KB/s\n                  {{ else if lt $dlSpeed 1000000.0 }}{{ printf \"%.0f KB/s\" (div $dlSpeed 1000.0) }}\n                  {{ else }}{{ printf \"%.1f MB/s\" (div $dlSpeed 1000000.0) }}{{ end }}\n                {{ else }}-- KB/s{{ end }}\n              </span>\n            </div>\n          </li>\n        {{ end }}\n      {{ end }}\n      \n      {{/* Inactive seeding torrents last */}}\n      {{ range $t := $seedingTorrents }}\n        {{ $state := $t.String \"state\" }}\n        {{ $ulSpeed := $t.Float \"upspeed\" }}\n        {{ $isActive := false }}\n        {{ if and $ulSpeed (or (eq $state \"uploading\") (eq $state \"stalledUP\") (eq $state \"forcedUP\")) }}\n          {{ if gt $ulSpeed 0.0 }}\n            {{ $isActive = true }}\n          {{ end }}\n        {{ end }}\n        {{ if not $isActive }}\n          {{ $status := $state }}\n          {{ if eq $state \"metaDL\" }}{{ $status = \"metadata\" }}{{ else if or (eq $state \"stalledUP\") (eq $state \"stalledDL\") }}{{ $status = \"stalled\" }}{{ else if or (eq $state \"pausedUP\") (eq $state \"pausedDL\") }}{{ $status = \"paused\" }}{{ else if or (eq $state \"stoppedUP\") (eq $state \"stoppedDL\") }}{{ $status = \"stopped\" }}{{ else if or (eq $state \"queuedUP\") (eq $state \"queuedDL\") }}{{ $status = \"queued\" }}{{ else if or (eq $state \"error\") (eq $state \"missingFiles\") }}{{ $status = \"error\" }}{{ else if or (eq $state \"checkingUP\") (eq $state \"checkingDL\") (eq $state \"checkingResumeData\") (eq $state \"allocating\") }}{{ $status = \"checking\" }}{{ end }}\n          \n          <li style=\"border-bottom:0.5px solid #3B404E; padding:10px 0;\">\n            <div class=\"torrent-grid\" style=\"display:grid; grid-template-columns:40px 1.2fr 1fr 100px 80px 80px; gap:8px; align-items:center; width:100%;\">\n              <span>↑</span>\n              <span title=\"{{ $t.String \"name\" }}\" style=\"overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ $t.String \"name\" }}</span>\n              <div style=\"display:flex; align-items:center; gap:8px;\">\n                <div class=\"mobile-hide\" style=\"background: rgba(128,128,128,0.12); height:8px; border-radius:4px; width:100%;\">\n                  <div style=\"width: {{ $t.Float \"progress\" | mul 100 }}%; background-color: {{ if lt ($t.Float \"progress\") 1.0 }}var(--color-info){{ else }}var(--color-positive){{ end }}; height:100%; border-radius:4px;\"></div>\n                </div>\n                <span style=\"min-width:48px;\">{{ $t.Float \"progress\" | mul 100 | printf \"%.1f\" }}%</span>\n              </div>\n              <span style=\"text-transform: capitalize;\">{{ $status }}</span>\n              <span class=\"mobile-hide\">\n                {{ $size := $t.Float \"size\" }}\n                {{ if lt $size 1073741824.0 }}\n                  {{ printf \"%.1f MB\" (div $size 1048576.0) }}\n                {{ else }}\n                  {{ printf \"%.1f GB\" (div $size 1073741824.0) }}\n                {{ end }}\n              </span>\n              <span style=\"width:80px;\">\n                {{ if $ulSpeed }}\n                  {{ if lt $ulSpeed 1000.0 }}-- KB/s\n                  {{ else if lt $ulSpeed 1000000.0 }}{{ printf \"%.0f KB/s\" (div $ulSpeed 1000.0) }}\n                  {{ else }}{{ printf \"%.1f MB/s\" (div $ulSpeed 1000000.0) }}{{ end }}\n                {{ else }}-- KB/s{{ end }}\n              </span>\n            </div>\n          </li>\n        {{ end }}\n      {{ end }}\n    </ul>\n  </div>\n{{ end }}\n{{ else }}\n    <div class=\"widget-error\">\n      <div class=\"widget-error-header\">\n        <div class=\"color-negative size-h3\">ERROR</div>\n        <svg class=\"widget-error-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.5\">\n          <path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z\"></path>\n        </svg>\n      </div>\n      <p class=\"size-sm\">Error fetching qBittorrent data.</p>\n    </div>\n{{ end }}\n"
